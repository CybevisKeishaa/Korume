<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- An exam shield with a pass check: the base JLPT mock-test mark.
       n4_mock reuses this exact shield and adds a filled star badge for
       the tier above N5 — a shape difference (a mark present or absent)
